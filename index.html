<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive"><meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f2efe8"><title>Gwazy · Fotografia</title>
  <link rel="icon" href="favicon.svg?v=smiley-1" type="image/svg+xml"><link rel="stylesheet" href="style.css?v=3">
  <script src="app.js?v=4" defer></script>
</head>
<body>
  <header class="site-header"><a class="brand" href="./" aria-label="Gwazy — início"><img src="favicon.svg?v=smiley-1" alt="" width="34" height="34" style="align-self:center;margin-right:12px">Gwazy<span class="brand-dot">.</span><small>FOTOGRAFIA</small></a><nav aria-label="Navegação" style="display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:20px"><button id="lock" class="quiet" hidden>← Todos os álbuns</button><a class="quiet" href="https://gwazyjustcause.github.io/airsoft-gallery/" style="text-decoration:none;white-space:nowrap">Fotografia de airsoft ↗</a></nav></header>
  <main>
    <section id="entrance" class="entrance"><div class="gallery-heading"><h1>Galeria</h1></div><div id="album-list" class="album-list" aria-label="Álbuns de fotografia"></div><p id="catalog-status" role="status"></p></section>
    <section id="album" hidden><div class="album-heading"><p id="album-meta" class="eyebrow"></p><h1 id="album-title"></h1><p id="album-description"></p></div><div class="toolbar"><span><span id="count"></span> fotografias</span><button id="unlock-downloads" class="quiet" hidden>Desbloquear downloads ↓</button><span class="toolbar-hint">Clique numa fotografia para ampliar</span></div><div id="grid" class="grid"></div></section>
  </main>
  <footer><span>© <span id="year"></span> Gwazy</span><span>Gabriela Ferreira · Fotografia</span></footer>
  <dialog id="access" class="password-dialog" aria-labelledby="access-title"><button id="close-access" class="close-access" aria-label="Fechar pedido de palavra-passe">✕</button><p id="access-label" class="eyebrow">ÁLBUM COM PALAVRA-PASSE</p><h2 id="access-title"></h2><p id="password-info">Introduza a palavra-passe para abrir este álbum.</p><form id="unlock-form"><label for="password">Palavra-passe</label><div class="input-row"><input id="password" name="password" type="password" autocomplete="current-password" required aria-describedby="message"><button type="button" id="show-password" class="reveal" aria-label="Mostrar palavra-passe" aria-pressed="false">Mostrar</button></div><button id="unlock" class="primary" type="submit">Abrir álbum <span>↗</span></button><p id="message" role="status" aria-live="polite"></p></form></dialog>
  <dialog id="viewer" aria-label="Fotografia ampliada"><div class="viewer-top"><span aria-hidden="true"></span><button id="close-viewer" aria-label="Fechar fotografia">Fechar ✕</button></div><div class="image-stage"><button id="previous" class="nav" aria-label="Fotografia anterior">←</button><img id="large-photo" alt="" draggable="false"><button id="next" class="nav" aria-label="Fotografia seguinte">→</button><p id="image-error" hidden>Não foi possível carregar a fotografia. Tente novamente.</p></div><div class="viewer-bottom"><span id="position"></span><button id="download" class="download" hidden>Descarregar fotografia ↓</button><span id="view-only" hidden>© Gwazy · Apenas visualização</span></div><p id="download-status" role="status" aria-live="polite"></p></dialog>
  <noscript><p class="noscript">Ative o JavaScript para abrir os álbuns.</p></noscript>
</body></html>
